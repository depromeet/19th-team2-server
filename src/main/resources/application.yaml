spring:
  application:
    name: team2-server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

springdoc:
  writer-with-order-by-keys: true
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cors:
    allowed-origins:
      - http://localhost:3000
